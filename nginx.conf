server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver so Nginx does not fail if a microservice restarts
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Unified Reverse Proxy for AWS API Gateway ({proxy+}) and same-origin SPA calls
    location /api/v1/pedidos {
        set $pedidos_upstream http://pedidos-service:8081;
        proxy_pass $pedidos_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/productos {
        set $productos_upstream http://productos-service:8082;
        proxy_pass $productos_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/carrito {
        set $carrito_upstream http://carrito-service:8083;
        proxy_pass $carrito_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id $http_x_user_id;
    }

    location /api/v1/notificaciones {
        set $notifications_upstream http://notifications-service:8084;
        proxy_pass $notifications_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/email {
        set $email_upstream http://notifications-service:8084;
        proxy_pass $email_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/envios {
        set $envios_upstream http://envios-service:8085;
        proxy_pass $envios_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/pagos {
        set $pagos_upstream http://pagos-service:8086;
        proxy_pass $pagos_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # RabbitMQ Management API Reverse Proxy (T20)
    # Server-side Basic Auth injection - credentials never exposed to browser
    location /api/ops/rabbitmq/ {
        set $rabbitmq_upstream http://rabbitmq:15672;
        rewrite ^/api/ops/rabbitmq/(.*) /api/$1 break;
        proxy_pass $rabbitmq_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic Z3Vlc3Q6Z3Vlc3Q=";
    }

    # Angular SPA history-mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
