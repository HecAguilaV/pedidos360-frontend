<div class="app-layout">
  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <a routerLink="/home" class="brand-link">
          <span class="brand-badge">P360</span>
          <span class="brand-title">Pedidos360</span>
        </a>
        <span class="env-tag">Cloud Native</span>
      </div>

      <nav class="nav-menu" *ngIf="authService.isAuthenticated()">
        <a routerLink="/home" routerLinkActive="active" class="nav-item">🏠 Inicio</a>
        <a routerLink="/productos" routerLinkActive="active" class="nav-item">📦 Productos</a>
        <a routerLink="/pedidos" routerLinkActive="active" class="nav-item">🛒 Pedidos</a>
      </nav>

      <div class="nav-auth">
        <ng-container *ngIf="authService.isAuthenticated(); else unauthenticated">
          <div class="user-info" *ngIf="authService.currentUser() as user">
            <span class="role-pill" [class.admin]="authService.isAdmin()">
              {{ authService.isAdmin() ? 'ADMIN' : 'USER' }}
            </span>
            <span class="user-display">{{ user.name }}</span>
          </div>
          <a routerLink="/logout" class="btn-logout">Salir</a>
        </ng-container>
        <ng-template #unauthenticated>
          <a routerLink="/login" class="btn-login">Ingresar</a>
        </ng-template>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>DSY1107 Desarrollo Cloud Native I — Angular 22 • Spring Boot 3 • PostgreSQL • Docker</p>
  </footer>
</div>
